 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
</head>
<body>
    <header>
        <h1> Tienda Online <sup> &copy;</sup> </h1>
        <nav> 
            <a href="#Datos_personales">Datos personales</a> <!-- Enlaces rapidos -->
            <a href="#preferencias">Preferencias</a>
            <a href="#tabla">Tabla de usuarios</a>
        </nav>
    </header>
    <main>
        <section>
            <h2> Registro</h2>
            <form>
                <fieldset>
                    <legend id="Datos_personales"> "Datos personales" </legend>
                    <br />
                    <label for="nombre">Primer nombre </label>
                    <input type="text" id="nombre" name="fname" placeholder="Primer nombre">
                    <br /><br />
                    <label for="apellido">Primer apellido </label>
                    <input type="text" id="apellido" name="lname" placeholder="Primer apellido">
                    <br /><br />
                    <label for="correo">E-mail</label>
                    <input type="email" id="correo" name="email" placeholder="ejemplo@gmail.com">
                    <br /><br />
                    <label for="Contraseña">Contraseña</label>
                    <input type="password" id="Contraseña" name="password" placeholder="****">
                    <br /><br />
                    <label for="edad">edad</label>
                    <input type="number" id="edad" name="age" placeholder="edad">
                    <br /><br />
                    <button>Guardar</button>
                    <br /><br />
                    <button type="button" onclick="alert('Registro exitoso')">Para js</button>
                </fieldset>
                <fieldset>
                    <legend id="preferencias"> "Preferencias" </legend>
                    <br />

                    <label for="Terminos">Terminos y condiciones</label>
                    <input type="checkbox" id="Terminos" name="terms" required>
                    <br /><br /> 

                    <label for="MetodoPago">Pago por transferencia</label>
                    <input type="radio" id="MetodoPago" name="payment_method" value="opcion1">
                    <br /><br />

                    <label for="MetodoPago2">Pago en efectivo</label>
                    <input type="radio" id="MetodoPago2" name="payment_method" value="opcion2">
                    <br /><br />

                    <label for="Range">Monto de dinero </label>
                    <input type="range" id="Range" name="range" min="100" max="500" step="100">
                    <br /><br />
                    
                    <button type="submit" id="btnRegistrar" name="registrar" value="Registrarme">Registrarme</button>
                    <br /><br />
                    <button type="button" id="btnGuardar" name="guardar" value="Guardar">Guardar</button>
                    <br /><br />

                </fieldset>
            </form>
            <h2>Buscar</h2>
            <form action="https://www.youtube.com/results">
                <fieldset>
                    <legend id="Busqueda">"Busqueda"</legend>
                    <label for="Busqueda"> Buscar en youtube </label>
                        <input type="text" id="Busqueda" name="search_query" placeholder="Video">
                        <button>Buscar</button>
                </fieldset>
            </form>
            <br /><br />
                 <table id="tabla" border="1">
                        <thead>
                            <tr>
                                <th colspan="3">Usuarios</th>
                            </tr>
                            <tr>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Edad</th>
                            </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Agustin</td>
                            <td rowspan="2">Valdes</td>
                            <td>20</td>
                        </tr>
                        <tr>
                            <td>Juan</td>
                            <td>20</td>
                        </tr>
                        </tbody>
                    </table>          
        </section>
    </main>
</body>
</html>
